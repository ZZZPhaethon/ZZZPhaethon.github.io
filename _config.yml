# Site Settings
title                    : "Yaowen Chang"
description              : "MSc Environmental Data Science & Machine Learning | Computer Vision • Semantic Segmentation • Domain Adaptation • Remote Sensing"
repository               : "ZZZPhaethon/ZZZPhaethon.github.io"

# If you are NOT using Google Scholar stats, set to false and keep googlescholar empty.
google_scholar_stats_use_cdn : false

# google analytics (optional)
google_analytics_id      :

# SEO Related (optional)
google_site_verification :
bing_site_verification   :
baidu_site_verification  :

# Site Author
author:
  name             : "Yaowen Chang"
  avatar           : "images/avatar.jpg"   # 把你的头像放到 images/avatar.jpg
  bio              : "MSc EDSML @ Imperial College London (2024–2025). Interested in semantic segmentation, source-free domain adaptation, and remote sensing."
  location         : "London, UK"
  employer         : "Imperial College London"
  pubmed           :
  googlescholar    :   # 不用 Scholar 就留空/删掉都行
  email            : "yaowenchang.ic@gmail.com"
  researchgate     :
  uri              :
  github           : "ZZZPhaethon"
  linkedin         :
  orcid            :
  twitter          :
  wikipedia        :

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - docs
  - google_scholar_crawler
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - .github
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Europe/London   # 你在英国建议用这个

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from

whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
